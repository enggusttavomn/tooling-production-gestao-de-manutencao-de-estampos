<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento de Roteiro</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    :root {
      --pl-green-700: #0b6b57;
      --pl-green-500: #138a6f;
      --pl-soft-bg: #f7fbf9;
      --pl-soft-line: rgba(7, 66, 56, 0.2);
    }

    .page {
      max-width: 1420px;
    }

    .planner-card {
      border: 1px solid var(--pl-soft-line);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff, #f3f8f6);
      padding: 16px;
      margin-bottom: 14px;
    }

    .planner-title {
      margin: 0 0 12px;
      font-family: "Space Grotesk", "Manrope", sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--pl-green-700);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .planner-search {
      display: grid;
      grid-template-columns: 110px minmax(260px, 420px) auto;
      gap: 12px;
      align-items: center;
    }

    .planner-search label {
      font-weight: 800;
      font-size: 16px;
      color: #0f172a;
      text-transform: uppercase;
    }

    .planner-search input {
      min-height: 42px;
      border: 1px solid #bfd2cb;
      background: #ffffff;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .planner-search input:focus {
      outline: 2px solid rgba(19, 138, 111, 0.28);
      border-color: #138a6f;
    }

    .planner-btn {
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid rgba(7, 66, 56, 0.3);
      border-radius: 8px;
      background: linear-gradient(145deg, var(--pl-green-500), var(--pl-green-700));
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      justify-self: start;
    }

    .planner-results {
      display: grid;
      gap: 12px;
    }

    .planner-block {
      border: 1px solid var(--pl-soft-line);
      border-radius: 12px;
      background: #f8fbfa;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(2, 6, 23, 0.06);
    }

    .planner-block-head {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--pl-soft-line);
      background: linear-gradient(180deg, #e8f2ee, #e2efea);
    }

    .planner-key {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
    }

    .planner-key span {
      font-size: 12px;
      font-weight: 800;
      color: var(--pl-green-700);
      text-transform: uppercase;
    }

    .planner-key strong {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }

    .planner-wrap {
      overflow-x: auto;
      background: #fff;
    }

    .planner-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    .planner-table th,
    .planner-table td {
      border: 1px solid rgba(2, 6, 23, 0.15);
      padding: 8px 8px;
      vertical-align: middle;
    }

    .planner-table th {
      background: #dceee6;
      color: var(--pl-green-700);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
    }

    .planner-table td {
      background: #fff;
      color: #111827;
      font-weight: 600;
    }

    .planner-table tbody tr:nth-child(even) td {
      background: #f8fbfa;
    }

    .planner-table td.status-cell {
      font-weight: 800;
      text-transform: none;
    }

    .planner-table td.status-cell.status-ok {
      background: #a9d99b;
      color: #111827;
    }

    .planner-table td.status-cell.status-warn {
      background: #fff36a;
      color: #c91f1f;
    }

    .planner-table td.status-cell.status-cancel {
      background: #a9d99b;
      color: #111827;
    }

    .planner-table td.tipo-destaque {
      color: #0b4db8;
      font-weight: 800;
    }

    .planner-empty {
      border: 1px dashed rgba(7, 66, 56, 0.3);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      color: #475569;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.9);
    }

    .actions {
      justify-content: space-between;
    }

    @media (max-width: 900px) {
      .planner-search {
        grid-template-columns: 1fr;
      }

      .planner-block-head {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <header class="panel-header">
        <div class="head-main">
          <div class="logo-box">
            <img src="assets/gevernova_logo.jpg" alt="GE Vernova">
          </div>
          <div class="head-text">
            <h1>Planejamento de Roteiro da JOB</h1>
            <p id="perfilInfo">Perfil Engenheiro de Processo</p>
          </div>
        </div>
      </header>

      <section class="planner-card" aria-label="Busca por job para planejamento">
        <h2 class="planner-title">Planejamento</h2>
        <div class="planner-search">
          <label for="jobInput">JOB</label>
          <input id="jobInput" name="job" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 2280091">
          <button type="button" class="btn planner-btn" id="btnGerar">Gerar bloco</button>
        </div>
      </section>

      <section class="planner-results" id="plannerResults" aria-live="polite">
        <div class="planner-empty" id="plannerEmpty">Digite uma JOB e clique em "Gerar bloco".</div>
      </section>

      <div class="actions">
        <a class="btn btn-outline" href="engenheiro.html">Voltar</a>
        <button type="button" class="btn btn-outline" id="btnSair">Sair</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const perfilAtivo = sessionStorage.getItem("perfil_ativo");
      const usuarioAtivo = sessionStorage.getItem("usuario_ativo") || "";
      const perfisPermitidos = ["engenheiro", "admin"];
      if (!perfisPermitidos.includes(perfilAtivo)) {
        window.location.replace("login.html");
        return;
      }

      const perfilInfo = document.getElementById("perfilInfo");
      if (perfilInfo) {
        const partesUsuario = usuarioAtivo.split(":");
        const nomeUsuario = partesUsuario.slice(1).join(":").trim();
        const perfilNome = perfilAtivo === "admin" ? "Admin (visao do engenheiro)" : "Engenheiro de Processo";
        perfilInfo.textContent = nomeUsuario ? ("Perfil " + perfilNome + ": " + nomeUsuario) : ("Perfil " + perfilNome);
      }

      const btnSair = document.getElementById("btnSair");
      if (btnSair) {
        btnSair.addEventListener("click", function () {
          sessionStorage.removeItem("perfil_ativo");
          sessionStorage.removeItem("usuario_ativo");
          window.location.replace("login.html");
        });
      }

      const jobsBase = {
        "2280091": {
          job: "2280091",
          jobIrma: "2852242/2",
          rows: [
            { status: "Corrigir Roteiro", statusClass: "status-warn", tipoLamina: "L&acirc;m. Estator", tipoDestaque: true, desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "No roteiro", statusClass: "status-ok", tipoLamina: "L&acirc;m. Excitatriz", desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "Incluir no Roteiro", statusClass: "status-warn", tipoLamina: "L&acirc;m. Extremidade", desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "Cancelado", statusClass: "status-cancel", tipoLamina: "L&acirc;m. Facetada", desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "NA", statusClass: "status-ok", tipoLamina: "L&acirc;m. Rotor", tipoDestaque: true, desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "No roteiro", statusClass: "status-ok", tipoLamina: "L&acirc;m. Sep Ext.", desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" },
            { status: "No roteiro", statusClass: "status-ok", tipoLamina: "L&acirc;m. Sep. Int.", desenho: "", pt: "", numeroFerramenta: "", descricaoFerramenta: "", prensa: "" }
          ]
        }
      };

      function normalizeJob(value) {
        return String(value || "").replace(/[^0-9A-Za-z-]/g, "").trim();
      }

      function getDataFromPendencias(jobValue) {
        const raw = sessionStorage.getItem("engenheiro_pendencias");
        if (!raw) {
          return null;
        }
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            return null;
          }
          const found = parsed.find(function (item) {
            return normalizeJob(item && item.job_cabecalho_engenheiro) === jobValue;
          });
          if (!found) {
            return null;
          }
          return {
            job: jobValue,
            jobIrma: "",
            rows: [
              {
                status: String(found.status || "NA"),
                statusClass: "status-warn",
                tipoLamina: "L&acirc;m. Estator",
                tipoDestaque: true,
                desenho: String(found.numero_desenho_ferramenta_engenheiro || ""),
                pt: "",
                numeroFerramenta: String(found.numero_ferramenta_engenheiro || ""),
                descricaoFerramenta: String(found.descricao_ferramenta_engenheiro || ""),
                prensa: ""
              }
            ]
          };
        } catch (_error) {
          return null;
        }
      }

      function renderPlannerBlock(data) {
        const rowsHtml = data.rows.map(function (row) {
          const statusClass = String(row.statusClass || "status-ok");
          const tipoClass = row.tipoDestaque ? ' class="tipo-destaque"' : "";
          return (
            "<tr>" +
              '<td class="status-cell ' + statusClass + '">' + String(row.status || "") + "</td>" +
              "<td" + tipoClass + ">" + String(row.tipoLamina || "") + "</td>" +
              "<td>" + String(row.desenho || "") + "</td>" +
              "<td>" + String(row.pt || "") + "</td>" +
              "<td>" + String(row.numeroFerramenta || "") + "</td>" +
              "<td>" + String(row.descricaoFerramenta || "") + "</td>" +
              "<td>" + String(row.prensa || "") + "</td>" +
            "</tr>"
          );
        }).join("");

        return (
          '<article class="planner-block">' +
            '<div class="planner-block-head">' +
              '<div class="planner-key"><span>JOB</span><strong>' + String(data.job || "") + "</strong></div>" +
              '<div class="planner-key"><span>JOB Irm&atilde;</span><strong>' + String(data.jobIrma || "") + "</strong></div>" +
              '<div class="planner-key"><span>Linhas geradas</span><strong>' + String(data.rows.length) + "</strong></div>" +
            "</div>" +
            '<div class="planner-wrap">' +
              '<table class="planner-table" aria-label="Tabela de planejamento da JOB">' +
                "<thead><tr>" +
                  "<th>Status Roteiro</th>" +
                  "<th>Tipo da L&acirc;mina</th>" +
                  "<th>Desenho</th>" +
                  "<th>PT</th>" +
                  "<th>N&ordm; Ferramenta</th>" +
                  "<th>Descri&ccedil;&atilde;o da Ferramenta</th>" +
                  "<th>Prensa</th>" +
                "</tr></thead>" +
                "<tbody>" + rowsHtml + "</tbody>" +
              "</table>" +
            "</div>" +
          "</article>"
        );
      }

      const jobInput = document.getElementById("jobInput");
      const btnGerar = document.getElementById("btnGerar");
      const plannerResults = document.getElementById("plannerResults");
      const plannerEmpty = document.getElementById("plannerEmpty");

      function gerarBloco() {
        const jobValue = normalizeJob(jobInput ? jobInput.value : "");
        if (!jobValue) {
          alert("Digite uma JOB valida para gerar o bloco.");
          if (jobInput) {
            jobInput.focus();
          }
          return;
        }

        const data = jobsBase[jobValue] || getDataFromPendencias(jobValue);
        if (!data) {
          alert("JOB " + jobValue + " nao encontrada na base de exemplo.");
          return;
        }

        if (plannerEmpty && plannerEmpty.parentElement) {
          plannerEmpty.remove();
        }
        plannerResults.insertAdjacentHTML("beforeend", renderPlannerBlock(data));
      }

      if (btnGerar) {
        btnGerar.addEventListener("click", gerarBloco);
      }

      if (jobInput) {
        jobInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            gerarBloco();
          }
        });
      }
    })();
  </script>
</body>
</html>
