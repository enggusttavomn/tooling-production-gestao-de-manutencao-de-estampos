<!-- Notas de manutencao: objetivo=preservar estrutura da tela; cuidado=nao quebrar ids/classes usados pelo JS; ao alterar=testar fluxo completo da pagina. -->
<!-- Arquivo: frontend/impressao_fichas.html -->
<!-- Descricao: Tela de listagem de fichas com filtros e botao de impressao individual. Suporta tipo=manutencao ou tipo=processo. -->
<!-- Observacao: Requer perfil_ativo='admin' ou 'engenheiro'. O botao 'Imprimir' redireciona para impressao_modelo.html. -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imprimir Fichas</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .page {
      max-width: 1420px;
    }

    .pendencias-wrap {
      overflow-x: auto;
      border: 1px solid rgba(2, 6, 23, 0.12);
      border-radius: 12px;
      background: #fff;
    }

    .pendencias-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    .pendencias-table thead th {
      background: #0b6b57;
      color: #fff;
      font-weight: 700;
      text-align: left;
      padding: 10px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      line-height: 1.25;
    }

    .pendencias-table thead th:last-child {
      border-right: none;
    }

    .pendencias-table tbody td {
      border-top: 1px solid rgba(2, 6, 23, 0.12);
      padding: 9px 8px;
      vertical-align: middle;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.92);
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.25;
    }

    .pendencias-table tbody tr:nth-child(even) td {
      background: rgba(238, 246, 243, 0.9);
    }

    .btn-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      width: 100%;
      max-width: 110px;
      padding: 6px 12px;
      border: 1px solid rgba(7, 66, 56, 0.28);
      border-radius: 8px;
      background: linear-gradient(145deg, #137f67, #0b6b57);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header-tools {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-filter {
      border-color: rgba(7, 66, 56, 0.28);
      background: linear-gradient(145deg, #ffffff, #eef4f1);
      color: #0b6b57;
    }

    .filter-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e63946;
      color: #fff;
      border-radius: 50%;
      width: 17px;
      height: 17px;
      font-size: 10px;
      font-weight: 800;
      margin-left: 4px;
      vertical-align: middle;
    }

    .filter-panel {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(7, 66, 56, 0.2);
      border-radius: 12px;
      padding: 10px 14px 10px;
      margin: 8px 0 10px;
    }

    .filter-panel.filter-panel-hidden {
      display: none;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 6px 12px;
      align-items: end;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .filter-field label {
      font-size: 10px;
      font-weight: 700;
      color: #0b6b57;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .filter-field input {
      border: 1px solid rgba(7, 66, 56, 0.25);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 12px;
      color: #0f172a;
      background: #fff;
      outline: none;
      height: 30px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .filter-field input:focus {
      border-color: #0b6b57;
      box-shadow: 0 0 0 2px rgba(11, 107, 87, 0.12);
    }

    .filter-field-range .range-inputs {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .filter-field-range .range-inputs input {
      flex: 1;
      min-width: 0;
    }

    .filter-field-range .range-inputs span {
      color: #6b7280;
      font-size: 13px;
    }

    .filter-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-sm {
      padding: 4px 14px;
      font-size: 12px;
    }

    .left-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty {
      padding: 16px;
      text-align: center;
      color: #6b7280;
      font-weight: 700;
    }

    .pendencias-table th:nth-child(1),
    .pendencias-table td:nth-child(1) { width: 13%; }
    .pendencias-table th:nth-child(2),
    .pendencias-table td:nth-child(2) { width: 15%; }
    .pendencias-table th:nth-child(3),
    .pendencias-table td:nth-child(3) { width: 10%; }
    .pendencias-table th:nth-child(4),
    .pendencias-table td:nth-child(4) { width: 9%; }
    .pendencias-table th:nth-child(5),
    .pendencias-table td:nth-child(5) { width: 13%; }
    .pendencias-table th:nth-child(6),
    .pendencias-table td:nth-child(6) { width: 18%; }
    .pendencias-table th:nth-child(7),
    .pendencias-table td:nth-child(7) { width: 14%; }
    .pendencias-table th:nth-child(8),
    .pendencias-table td:nth-child(8) { width: 8%; text-align: center; }

    .pendencias-table td:nth-child(7) {
      font-size: 12px;
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .pendencias-table td:nth-child(8) {
      overflow-wrap: normal;
      word-break: keep-all;
    }

    @media (max-width: 760px) {
      .page {
        max-width: 980px;
      }

      .pendencias-wrap {
        overflow-x: auto;
      }

      .pendencias-table {
        min-width: 980px;
        table-layout: auto;
      }

      .actions {
        justify-content: center;
      }
    }
  </style>
</head>

<!-- ===== BODY: layout da tela de impressao de fichas ===== -->
<body>
  <main class="page">
    <section class="panel">

      <!-- ===== Cabecalho: logo, titulo dinamico e botao de filtro ===== -->
      <!-- O titulo muda conforme o parametro tipo=manutencao|processo na URL -->
      <header class="panel-header">
        <div class="head-main">
          <!-- Logo GE Vernova -->
          <div class="logo-box">
            <img src="assets/gevernova_logo.jpg" alt="GE Vernova">
          </div>
          <!-- Titulo da tela (manutencao ou processo) definido dinamicamente pelo JS -->
          <div class="head-text">
            <h1 id="tituloTela">Impress&atilde;o de Fichas</h1>
            <p id="subtituloTela">Perfil: Admin</p>
          </div>
        </div>
        <!-- Botao que exibe/oculta o painel de filtros -->
        <div class="panel-header-tools">
          <button type="button" class="btn btn-filter" id="btnFiltro">Filtro <span class="filter-badge" id="filterBadge" style="display:none">0</span></button>
        </div>
      </header>

      <!-- ===== Painel de filtros (colapsavel) ===== -->
      <!-- Filtros: numero da ficha, JOB, ferramenta, descricao, desenho, data de entrega -->
      <div class="filter-panel filter-panel-hidden" id="filterPanel">
        <div class="filter-grid">
          <div class="filter-field">
            <label for="fNumeroFicha">N&ordm; da Ficha</label>
            <input id="fNumeroFicha" type="text" placeholder="Filtrar ficha..." autocomplete="off">
          </div>
          <div class="filter-field">
            <label for="fJob">JOB</label>
            <input id="fJob" type="text" placeholder="Filtrar JOB..." autocomplete="off">
          </div>
          <div class="filter-field">
            <label for="fNumeroFerramenta">N&ordm; da Ferramenta</label>
            <input id="fNumeroFerramenta" type="text" placeholder="Filtrar ferramenta..." autocomplete="off">
          </div>
          <div class="filter-field">
            <label for="fDescricaoFerramenta">Descri&ccedil;&atilde;o da Ferramenta</label>
            <input id="fDescricaoFerramenta" type="text" placeholder="Filtrar descri&ccedil;&atilde;o..." autocomplete="off">
          </div>
          <div class="filter-field">
            <label for="fDesenhoFerramenta">N&ordm; Desenho Ferramenta</label>
            <input id="fDesenhoFerramenta" type="text" placeholder="Filtrar desenho..." autocomplete="off">
          </div>
          <div class="filter-field filter-field-range">
            <label>Data Entrega Evento (SAP)</label>
            <div class="range-inputs">
              <input type="date" id="fDataEntregaMin">
              <span>&ndash;</span>
              <input type="date" id="fDataEntregaMax">
            </div>
          </div>
        </div>
        <div class="filter-footer">
          <button type="button" class="btn btn-secondary btn-sm" id="btnAplicarFiltro">Aplicar filtros</button>
          <button type="button" class="btn btn-outline btn-sm" id="btnLimparFiltro">Limpar</button>
        </div>
      </div>

      <!-- ===== Tabela de fichas carregada da API ===== -->
      <!-- Colunas: Numero da Ficha, Data Entrega SAP, AME Resp., JOB, Ferramenta, Descricao, Desenho, Acao -->
      <div class="pendencias-wrap">
        <table class="pendencias-table" aria-label="Tabela de fichas para impress&atilde;o">
          <thead>
            <tr>
              <th>N&uacute;mero da Ficha</th>
              <th>Data Entrega Evento (SAP)</th>
              <th>AME Resp.</th>
              <th>JOB</th>
              <th>N&ordm; da Ferramenta</th>
              <th>Descri&ccedil;&atilde;o da Ferramenta</th>
              <th>N&ordm; Desenho Ferramenta</th>
              <th>A&ccedil;&atilde;o</th>
            </tr>
          </thead>
          <tbody id="fichasBody"></tbody>
        </table>
        <div class="empty" id="emptyState" hidden>Nenhuma ficha encontrada.</div>
      </div>

      <!-- Botoes de navegacao: exportar, voltar e logout -->
      <div class="actions">
        <div class="left-actions" id="leftActions"></div>
        <button type="button" class="btn btn-outline" id="btnSair">Sair</button>
      </div>
    </section>
  </main>

  <!-- ===== SCRIPT: autenticacao, carregamento e impressao individual de fichas ===== -->
  <!--
    Fluxo: verifica perfil -> le tipo da URL -> carrega /api/fichas ->
    renderiza com renderFichas() -> clique em 'Imprimir' salva no sessionStorage
    e redireciona para impressao_modelo.html.
  -->
    <script>
    (function () {
      const perfilAtivo = sessionStorage.getItem("perfil_ativo");
      const usuarioAtivo = sessionStorage.getItem("usuario_ativo") || "";
      const perfilPermitido = perfilAtivo === "admin" || perfilAtivo === "engenheiro";
      if (!perfilPermitido) {
        window.location.replace("login.html");
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const tipo = params.get("tipo") === "processo" ? "processo" : "manutencao";
      const API_URL = "/api";
      let fichas = [];
      let filteredFichas = [];

      const tituloTela = document.getElementById("tituloTela");
      const subtituloTela = document.getElementById("subtituloTela");
      if (tituloTela) {
        tituloTela.textContent = tipo === "processo" ? "Impressao de Fichas de Processo" : "Fichas de Manutencao";
      }
      if (subtituloTela) {
        const perfilNomes = {
          admin: "Admin",
          engenheiro: "Engenheiro de Processo",
          producao: "Producao",
          ferramenteiro: "Ferramenteiro"
        };
        const partesUsuario = usuarioAtivo.split(":");
        const perfilUsuario = (partesUsuario[0] || perfilAtivo || "").trim().toLowerCase();
        const nomeUsuario = partesUsuario.slice(1).join(":").trim();
        const perfilLabel = perfilNomes[perfilUsuario] || perfilNomes[perfilAtivo] || "Usuario";
        const perfilTexto = nomeUsuario ? "Perfil " + perfilLabel + ": " + nomeUsuario : "Perfil " + perfilLabel;
        const contextoTela = tipo === "processo" ? "AME Imprimir ficha de processo" : "AME Imprimir ficha de manutencao";
        subtituloTela.textContent = perfilTexto + " | " + contextoTela;
      }

      const fichasBody = document.getElementById("fichasBody");
      const emptyState = document.getElementById("emptyState");
      const btnFiltro = document.getElementById("btnFiltro");
      const filterPanel = document.getElementById("filterPanel");
      const filterBadge = document.getElementById("filterBadge");
      const fNumeroFicha = document.getElementById("fNumeroFicha");
      const fJob = document.getElementById("fJob");
      const fNumeroFerramenta = document.getElementById("fNumeroFerramenta");
      const fDescricaoFerramenta = document.getElementById("fDescricaoFerramenta");
      const fDesenhoFerramenta = document.getElementById("fDesenhoFerramenta");
      const fDataEntregaMin = document.getElementById("fDataEntregaMin");
      const fDataEntregaMax = document.getElementById("fDataEntregaMax");
      const btnAplicarFiltro = document.getElementById("btnAplicarFiltro");
      const btnLimparFiltro = document.getElementById("btnLimparFiltro");

      function createCell(text) {
        const td = document.createElement("td");
        td.textContent = repairMojibake(text || "");
        return td;
      }

      function repairMojibake(value) {
        let text = String(value || "");
        if (!/[ÃƒÃ‚Ã¢]/.test(text)) {
          return text;
        }
        for (let i = 0; i < 3; i += 1) {
          try {
            const rawBytes = Uint8Array.from(text, function (char) {
              return char.charCodeAt(0) & 0xff;
            });
            const decoded = new TextDecoder("utf-8", { fatal: true }).decode(rawBytes);
            if (decoded === text) {
              break;
            }
            text = decoded;
            if (!/[ÃƒÃ‚Ã¢]/.test(text)) {
              break;
            }
          } catch (_error) {
            break;
          }
        }
        return text;
      }

      function normalizeText(value) {
        return repairMojibake(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLowerCase();
      }

      function formatDateToBrShort(value) {
        if (!value) {
          return "";
        }
        const dt = new Date(value);
        if (Number.isNaN(dt.getTime())) {
          return String(value);
        }
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const day = String(dt.getDate()).padStart(2, "0");
        return day + "-" + monthNames[dt.getMonth()] + "-" + dt.getFullYear();
      }

      function toDateStamp(value) {
        if (value === null || value === undefined || value === "") {
          return null;
        }
        const raw = String(value).trim();
        if (!raw) {
          return null;
        }
        let year;
        let month;
        let day;
        let match = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (match) {
          year = Number(match[1]);
          month = Number(match[2]);
          day = Number(match[3]);
        } else {
          match = raw.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);
          if (!match) {
            return null;
          }
          const monthMap = {
            jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
            jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
          };
          day = Number(match[1]);
          month = monthMap[String(match[2] || "").toLowerCase()] || 0;
          year = Number(match[3]);
        }
        if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day) || month < 1 || month > 12) {
          return null;
        }
        const dt = new Date(Date.UTC(year, month - 1, day));
        if (
          dt.getUTCFullYear() !== year ||
          dt.getUTCMonth() + 1 !== month ||
          dt.getUTCDate() !== day
        ) {
          return null;
        }
        return year * 10000 + month * 100 + day;
      }

      function countActiveFilters() {
        let count = 0;
        const values = [
          fNumeroFicha && fNumeroFicha.value,
          fJob && fJob.value,
          fNumeroFerramenta && fNumeroFerramenta.value,
          fDescricaoFerramenta && fDescricaoFerramenta.value,
          fDesenhoFerramenta && fDesenhoFerramenta.value,
          fDataEntregaMin && fDataEntregaMin.value,
          fDataEntregaMax && fDataEntregaMax.value
        ];
        values.forEach((value) => {
          if (String(value || "").trim() !== "") {
            count += 1;
          }
        });
        return count;
      }

      function applyFilters() {
        const numeroFichaFilter = normalizeText(fNumeroFicha && fNumeroFicha.value);
        const jobFilter = normalizeText(fJob && fJob.value);
        const numeroFerramentaFilter = normalizeText(fNumeroFerramenta && fNumeroFerramenta.value);
        const descricaoFerramentaFilter = normalizeText(fDescricaoFerramenta && fDescricaoFerramenta.value);
        const desenhoFerramentaFilter = normalizeText(fDesenhoFerramenta && fDesenhoFerramenta.value);
        const dataEntregaMin = toDateStamp(fDataEntregaMin && fDataEntregaMin.value);
        const dataEntregaMax = toDateStamp(fDataEntregaMax && fDataEntregaMax.value);

        filteredFichas = fichas.filter((item) => {
          if (numeroFichaFilter && !normalizeText(item.numero_ficha).includes(numeroFichaFilter)) {
            return false;
          }
          if (jobFilter && !normalizeText(item.job_cabecalho).includes(jobFilter)) {
            return false;
          }
          if (numeroFerramentaFilter && !normalizeText(item.numero_ferramenta).includes(numeroFerramentaFilter)) {
            return false;
          }
          if (descricaoFerramentaFilter && !normalizeText(item.descricao_ferramenta).includes(descricaoFerramentaFilter)) {
            return false;
          }
          if (desenhoFerramentaFilter && !normalizeText(item.numero_desenho_ferramenta).includes(desenhoFerramentaFilter)) {
            return false;
          }

          const dataEntregaStamp = toDateStamp(item.data_entrega_evento_sap);
          if (dataEntregaMin !== null && (dataEntregaStamp === null || dataEntregaStamp < dataEntregaMin)) {
            return false;
          }
          if (dataEntregaMax !== null && (dataEntregaStamp === null || dataEntregaStamp > dataEntregaMax)) {
            return false;
          }

          return true;
        });

        const activeFilterCount = countActiveFilters();
        if (filterBadge) {
          if (activeFilterCount > 0) {
            filterBadge.textContent = String(activeFilterCount);
            filterBadge.style.display = "";
          } else {
            filterBadge.style.display = "none";
          }
        }

        renderFichas();
      }

      let applyFiltersTimer = null;
      function scheduleApplyFilters() {
        if (applyFiltersTimer) {
          clearTimeout(applyFiltersTimer);
        }
        applyFiltersTimer = setTimeout(function () {
          applyFilters();
          applyFiltersTimer = null;
        }, 140);
      }

      function toFichaTabela(item) {
        return {
          id: String(item.numero_ficha || item.id || ""),
          numero_ficha: String(item.numero_ficha || ""),
          data_entrega_evento_sap: formatDateToBrShort(item.data_entrega_evento || item.data_cadastro),
          ame_resp_abertura: repairMojibake(item.responsavel_abertura || item.responsavel || ""),
          job_cabecalho: repairMojibake(item.job || ""),
          numero_ferramenta: repairMojibake(item.numero_ferramental || ""),
          descricao_ferramenta: repairMojibake(item.descricao_ferramenta || item.descricao || ""),
          numero_desenho_ferramenta: repairMojibake(item.numero_desenho_ferramental || ""),
          raw: item
        };
      }

      function renderFichas() {
        fichasBody.innerHTML = "";
        const filtradas = Array.isArray(filteredFichas) ? filteredFichas : fichas;
        if (filtradas.length === 0) {
          emptyState.hidden = false;
          return;
        }
        emptyState.hidden = true;

        filtradas.forEach((item) => {
          const tr = document.createElement("tr");
          tr.appendChild(createCell(item.numero_ficha));
          tr.appendChild(createCell(item.data_entrega_evento_sap));
          tr.appendChild(createCell(item.ame_resp_abertura));
          tr.appendChild(createCell(item.job_cabecalho));
          tr.appendChild(createCell(item.numero_ferramenta));
          tr.appendChild(createCell(item.descricao_ferramenta));
          tr.appendChild(createCell(item.numero_desenho_ferramenta));

          const tdAcao = document.createElement("td");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-row";
          btn.textContent = "Imprimir";
          btn.dataset.fichaId = item.id;
          tdAcao.appendChild(btn);
          tr.appendChild(tdAcao);

          fichasBody.appendChild(tr);
        });
      }

      async function carregarFichas() {
        try {
          const response = await fetch(API_URL + "/fichas");
          if (!response.ok) {
            throw new Error("Falha ao carregar fichas");
          }
          const rows = await response.json();
          fichas = Array.isArray(rows) ? rows.map(toFichaTabela) : [];
        } catch (_error) {
          fichas = [];
        }
        filteredFichas = fichas.slice();
        applyFilters();
      }

      fichasBody.addEventListener("click", function (event) {
        const target = event.target;
        if (!(target instanceof Element)) {
          return;
        }
        const button = target.closest("button[data-ficha-id]");
        if (!button) {
          return;
        }
        const fichaId = button.getAttribute("data-ficha-id");
        const ficha = fichas.find((item) => item.id === fichaId);
        if (!ficha) {
          return;
        }

        sessionStorage.setItem("admin_impressao_ficha_ativa", JSON.stringify(ficha.raw || {}));
        window.location.href = "impressao_modelo.html?tipo=" + encodeURIComponent(tipo) + "&ficha=" + encodeURIComponent(ficha.numero_ficha);
      });

      if (btnFiltro && filterPanel) {
        btnFiltro.addEventListener("click", function () {
          filterPanel.classList.toggle("filter-panel-hidden");
        });
      }

      if (btnAplicarFiltro) {
        btnAplicarFiltro.addEventListener("click", applyFilters);
      }

      const liveFilterInputs = [
        fNumeroFicha,
        fJob,
        fNumeroFerramenta,
        fDescricaoFerramenta,
        fDesenhoFerramenta,
        fDataEntregaMin,
        fDataEntregaMax
      ];

      liveFilterInputs.forEach((inputEl) => {
        if (!inputEl) {
          return;
        }
        inputEl.addEventListener("input", scheduleApplyFilters);
        inputEl.addEventListener("change", applyFilters);
      });

      if (btnLimparFiltro) {
        btnLimparFiltro.addEventListener("click", function () {
          liveFilterInputs.forEach((inputEl) => {
            if (!inputEl) {
              return;
            }
            inputEl.value = "";
          });
          filteredFichas = fichas.slice();
          if (filterBadge) {
            filterBadge.style.display = "none";
          }
          renderFichas();
        });
      }

      const leftActions = document.getElementById("leftActions");
      if (leftActions) {
        const backHref = perfilAtivo === "engenheiro" ? "engenheiro.html" : "admin.html";
        leftActions.innerHTML = '<a class="btn btn-secondary" href="' + backHref + '">Voltar</a>';
      }

      const btnSair = document.getElementById("btnSair");
      if (btnSair) {
        btnSair.addEventListener("click", function () {
          sessionStorage.removeItem("perfil_ativo");
          sessionStorage.removeItem("usuario_ativo");
          sessionStorage.removeItem("admin_impressao_ficha_ativa");
          window.location.replace("login.html");
        });
      }

      carregarFichas();
    })();
  </script>
</body>
</html>
